services:
  codelens:
    build: .
    init: true
    restart: unless-stopped
    env_file: server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_PATH: /app/server/data/codelens.db
      UPLOAD_DIR: /app/server/data/uploads
      FAKE_LLM: "false"
      ALLOW_DEV_AUTH_FALLBACK: "false"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - codelens-data:/app/server/data
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
volumes:
  codelens-data:
