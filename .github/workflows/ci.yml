name: Validate CodeLens
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci && npm ci --prefix server && npm ci --prefix client
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:keyless
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: docker build -t codelens-ci .
      - run: docker run -d --name codelens-ci -p 127.0.0.1:5097:5000 -e LOGIN_USERS=production-test@example.com:production-test-password codelens-ci
      - run: node server/e2e/production.js http://127.0.0.1:5097
      - if: always()
        run: docker logs codelens-ci; docker rm -f codelens-ci
